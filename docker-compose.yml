services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    environment:
      DATABASE_URL: sqlite:////data/portal.db
      STATIC_DIR: /app/static
      MEDIA_DIR: /data/media
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-please}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      EXTERNAL_GALLERY_WEBDAV_URL: ${EXTERNAL_GALLERY_WEBDAV_URL:-}
      EXTERNAL_GALLERY_WEBDAV_USERNAME: ${EXTERNAL_GALLERY_WEBDAV_USERNAME:-}
      EXTERNAL_GALLERY_WEBDAV_PASSWORD: ${EXTERNAL_GALLERY_WEBDAV_PASSWORD:-}
      EXTERNAL_GALLERY_WEBDAV_PATH: ${EXTERNAL_GALLERY_WEBDAV_PATH:-}
      EXTERNAL_GALLERY_MAX_ITEMS: ${EXTERNAL_GALLERY_MAX_ITEMS:-2000}
      EXTERNAL_GALLERY_MAX_DEPTH: ${EXTERNAL_GALLERY_MAX_DEPTH:-16}
    volumes:
      - ./data:/data
